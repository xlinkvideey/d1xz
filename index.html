<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  min-height:100%;
  overflow-x:hidden;
  background:#fff;
  color:#111;
  font-family:Arial,sans-serif;
}

/* HEADER */
.main-header{
  width:100%;
  padding:12px 16px;
  background:#fff;
  border-bottom:1px solid #ddd;
  position:sticky;
  top:0;
  z-index:999;
}

.header-container{
  width:100%;
  max-width:1200px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

.header-left{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

.header-title{
  text-decoration:none;
  color:#111;
  font-size:clamp(20px,4vw,30px);
  font-weight:bold;
}

.header-upload-btn{
  text-decoration:none;
  background:#f3f4f6;
  color:#111;
  padding:10px 16px;
  border-radius:12px;
  font-size:14px;
  font-weight:600;
}

/* VIDEO AREA */
.video-player-wrap{
  width:100%;
  padding:15px;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.player-row{
  width:100%;
  max-width:1400px;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  gap:20px;
}

/* SIDE ADS */
.ad-side{
  width:160px;
  flex-shrink:0;
}

@media(max-width:1100px){
  .ad-side{
    display:none;
  }
}

/* VIDEO BOX */
.video-box{
  width:100%;
  max-width:900px;
  aspect-ratio:16/9;
  background:#000;
  border-radius:14px;
  overflow:hidden;
  position:relative;
  box-shadow:0 2px 15px rgba(0,0,0,.15);
}

.video-box video{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
}

/* CLICK LAYER */
.video-click-layer{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  background:transparent;
  border:none;
  z-index:5;
  cursor:pointer;
}

/* PLAY OVERLAY */
.play-overlay{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:70px;
  height:70px;
  border-radius:50%;
  background:rgba(0,0,0,.5);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:3;
}

.play-overlay svg{
  width:36px;
  fill:#fff;
}

/* ACTION BUTTON */
.video-actions{
  width:100%;
  display:flex;
  justify-content:center;
  padding:20px 15px;
}

.download-btn{
  text-decoration:none;
  background:linear-gradient(90deg,#667eea,#764ba2);
  color:#fff;
  padding:14px 26px;
  border-radius:40px;
  font-size:16px;
  font-weight:bold;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  width:100%;
  max-width:320px;
  text-align:center;
}

/* BOTTOM FIXED ADS */
#donmeg{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:9999;
  padding:5px;
  overflow:hidden;
}

#donmeg iframe,
#donmeg img{
  max-width:100%;
  height:auto;
}

/* FOOTER */
footer{
  width:100%;
  text-align:center;
  padding:25px 15px 90px;
  color:gray;
  font-size:14px;
}

footer a{
  color:inherit;
  text-decoration:none;
}

/* MOBILE */
@media(max-width:768px){

  .video-player-wrap{
    padding:10px;
  }

  .video-box{
    border-radius:10px;
    width:100%;
  }

  .download-btn{
    font-size:15px;
    padding:13px 20px;
  }

  .video-actions{
    position:sticky;
    bottom:10px;
    z-index:999;
  }

  .header-upload-btn{
    width:100%;
    text-align:center;
  }
}

/* SMALL DEVICES */
@media(max-width:480px){

  .header-container{
    justify-content:center;
    text-align:center;
  }

  .header-left{
    justify-content:center;
  }

  .header-title{
    width:100%;
  }

  .download-btn{
    max-width:100%;
  }

  footer{
    font-size:13px;
  }
}
</style>
